# ~/.ledger/worlds.yml — danh sách repo theo từng "thế giới" của BẠN.
#
# File cấp MÁY, không nằm trong repo nào, không commit.
# Không có script nào đọc nó: CHÍNH BẠN đọc nó khi cần nhìn ngang nhiều repo
# ("hôm nay làm gì" trên hàng chục repo). Sửa bằng tay.
#
# Mỗi world là một thế giới tách biệt: thư mục gốc, tài khoản GitHub, SSH alias.
# Tên world và đường dẫn dưới đây là ví dụ — thay bằng cái của bạn.

version: 1

worlds:
  work:
    root: D:/work
    gh_account: your-work-account
    ssh_alias: github-work-account
    repos:
      - name: your-org/your-app
        path: D:/work/your-app
        ssh_alias: github-work-account

  personal:
    root: D:/projects
    gh_account: your-personal-account
    ssh_alias: github-personal-account
    repos:
      - name: your-name/your-skills
        path: D:/projects/your-skills
        ssh_alias: github-personal-account

# Thông báo: chỉ gửi một chiều. Đừng đặt secret ở đây nếu máy dùng chung —
# để trống và export biến môi trường LEDGER_CHAT_WEBHOOK.
notify:
  google_chat_webhook: ""